<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matt Weglewski's Didactics</title>
  <meta name="description" content="Matt's Didactics — teaching materials by subject" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>📚</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <header>
    <div class="wrap">
      <div class="row">
        <button class="brand" id="brandBtn" title="Back to subjects">
          <div class="logo" aria-hidden="true">📚</div>
          <div>
            <h1>Didactics</h1>
            <small>R 3 D H 3 R R 1 N 6</small>
          </div>
        </button>

        <div class="crumb" id="crumb" hidden>
          <button class="back" id="backBtn">← back</button>
          <span class="path"><b id="crumbIcon"></b> <span id="crumbName"></span></span>
        </div>

        <div class="controls" id="libraryControls" hidden>
          <div class="search input" role="search">
            <span class="icon">🔎</span>
            <input id="q" type="search" placeholder="Search..." autocomplete="off" />
          </div>
          <select id="sort">
            <option value="recent">Recent</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
          </select>
          <button id="clearBtn" class="btn" title="Disable filters">Disable</button>
        </div>
        <div id="tags" class="tags" aria-label="Filter by tags"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- ====== HUB VIEW — subject picker as a build pipeline ====== -->
    <section id="hubView">
      <div class="hero">
        <p class="eyebrow" id="heroEyebrow">select-subject.sh</p>
        <h2 id="heroTitle">What are you teaching or studying today?</h2>
        <p class="lede" id="heroLede">Worksheets, mock exams and lab material, organised by subject. Pick a stage to open it.</p>
      </div>
      <div id="pipeline" class="pipeline" role="list"></div>
    </section>

    <!-- ====== LIBRARY VIEW ====== -->
    <section id="libraryView" hidden>
      <div class="subject-intro">
        <span class="ic" id="introIcon"></span>
        <div>
          <h2 id="introName"></h2>
          <p id="introTagline"></p>
        </div>
        <span class="status-pill" id="introStatus"></span>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> • by Mateusz Węglewski • <a class="link" href="https://github.com/mateuszweglewski" target="_blank" rel="noopener">See my other projects</a>
  </footer>

  <!-- ====== templates ====== -->
  <template id="tpl-stage">
    <div class="stage" role="listitem">
      <button class="node" type="button"></button>
      <div class="stage-label">
        <span class="stage-name"></span>
        <span class="stage-status"></span>
      </div>
    </div>
  </template>

  <template id="tpl-card">
    <article class="card" data-id="">
      <div class="cover" aria-hidden="true">
        📖
        <span class="format-badge"></span>
      </div>
      <div class="content">
        <div class="title"></div>
        <div class="meta"></div>
        <div class="actions">
          <a class="btn btn-primary link btn-read" href="#" target="_blank" rel="noopener">Open</a>
          <button class="btn btn-outline btn-info" data-action="info">Details</button>
        </div>
      </div>
    </article>
  </template>

  <!-- ====== MODAL ====== -->
  <dialog id="dlg">
    <button class="btn close" data-action="close">✕</button>
    <div class="modal">
      <div class="cover" id="dlgCover">📖</div>
      <div>
        <h2 id="dlgTitle"></h2>
        <p class="desc" id="dlgDesc"></p>
        <div class="row" style="gap:10px;margin:8px 0 14px">
          <span class="pill" id="dlgAuthor"></span>
          <span class="pill" id="dlgYear"></span>
          <span class="pill" id="dlgFormat"></span>
        </div>
        <div class="tags" id="dlgTags"></div>
        <div class="row" style="gap:10px;margin-top:14px">
          <a id="dlgOpen" class="btn btn-primary link" target="_blank" rel="noopener">Open PDF</a>
          <a id="dlgDownload" class="btn btn-outline link" download>Download</a>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/data.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
